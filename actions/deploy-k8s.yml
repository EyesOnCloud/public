name: Deploy to Kubernetes

on:
  push:
    branches: [ main ]
    paths:
      - 'k8s-webapp/**'
      - '.github/workflows/**'

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./k8s-webapp
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/k8s-actions-app:${{ github.sha }}

  deploy:
    needs: build-push
    runs-on: [self-hosted, k8s-deploy]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply Kubernetes manifests
        env:
          KUBECONFIG: /home/tux/actions-runner/kubeconfig
        run: |
          kubectl apply -f k8s-webapp/deployment.yml
          kubectl apply -f k8s-webapp/service.yml

      - name: Set new image on deployment
        env:
          KUBECONFIG: /home/tux/actions-runner/kubeconfig
        run: |
          kubectl set image deployment/webapp-deployment \
            webapp=${{ secrets.DOCKER_USERNAME }}/k8s-actions-app:${{ github.sha }}

      - name: Wait for rollout to complete
        env:
          KUBECONFIG: /home/tux/actions-runner/kubeconfig
        run: kubectl rollout status deployment/webapp-deployment --timeout=90s
