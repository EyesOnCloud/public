apiVersion: s3.aws.m.upbound.io/v1beta1
kind: Bucket
metadata:
  name: <your-bucket-name>
  namespace: drift-recovery
spec:
  forProvider:
    region: us-east-1
    tags:
      owner: manual-override
      change-process: gitops
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
